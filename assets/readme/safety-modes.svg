<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-labelledby="t d">
<title id="t">Three modes, safe by default</title>
<desc id="d">SC_MODE=read-only (default): reads, analytics and reports only. SC_MODE=write: create and update records; every write is audited. SC_MODE=full: deletes and bulk changes run a dry run first and need a single-use confirm token bound to the exact arguments.</desc>
<rect width="880" height="250" rx="14" fill="#16191d"/><rect x="0.5" y="0.5" width="879" height="249" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
<text x="32" y="44" font-family="'Archivo', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef0f2">Three modes, safe by default</text>
<text x="32" y="66" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a9afb6">you choose with SC_MODE; the AI cannot switch it</text>
<g transform="translate(32,84)"><rect width="260" height="140" rx="10" fill="#1f2328" stroke="#cfee3a"/><rect x="16" y="16" width="64" height="20" rx="10" fill="#cfee3a"/><text x="48" y="30" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1b1f24">default</text><text x="16" y="62" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#eef0f2">read-only</text><text x="16" y="82" font-family="'Archivo', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a9afb6">reads, analytics, reports</text><text x="16" y="106" font-family="'Archivo', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef0f2">writes refused</text><text x="16" y="124" font-family="'Archivo', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef0f2">nothing changes in Mitti</text></g>
<g transform="translate(310,84)"><rect width="260" height="140" rx="10" fill="#1f2328" stroke="#2b3036"/><text x="16" y="40" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#eef0f2">write</text><text x="16" y="60" font-family="'Archivo', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a9afb6">create and update</text><text x="16" y="86" font-family="'Archivo', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef0f2">new actions, issues, notes</text><text x="16" y="104" font-family="'Archivo', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef0f2">every write in a local audit log</text></g>
<g transform="translate(588,84)"><rect width="260" height="140" rx="10" fill="#1f2328" stroke="#2b3036"/><text x="16" y="40" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#eef0f2">full</text><text x="16" y="60" font-family="'Archivo', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a9afb6">deletes and bulk changes</text><text x="16" y="86" font-family="'Archivo', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef0f2">dry run shows the plan first</text><text x="16" y="104" font-family="'Archivo', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#eef0f2">then a single-use confirm token</text></g>
<line x1="294" y1="154" x2="306" y2="154" stroke="#a9afb6" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="572" y1="154" x2="584" y2="154" stroke="#a9afb6" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
