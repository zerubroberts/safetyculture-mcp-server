name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsup
      - run: npx vitest run
      - run: node scripts/scan-secrets.mjs
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Build the Claude Desktop extension
        run: npm run build:mcpb
      - name: Attach the extension to the GitHub release
        run: gh release create "$GITHUB_REF_NAME" safetyculture-mcp.mcpb --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md" || gh release upload "$GITHUB_REF_NAME" safetyculture-mcp.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
