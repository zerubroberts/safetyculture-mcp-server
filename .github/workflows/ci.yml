name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsup
      - run: npx vitest run
      - run: node scripts/scan-secrets.mjs
      - name: Tool reference is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npx tsx scripts/gen-tool-docs.ts && git diff --exit-code docs/TOOLS.md
